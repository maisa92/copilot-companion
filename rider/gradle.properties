# IntelliJ Platform Gradle Plugin needs a fair amount of heap for the searchable-options
# and verification tasks.
org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
# Corporate TLS-inspection proxy (SpaceInt): use a truststore that includes the corp
# root CA, otherwise every https fetch fails with "PKIX path building failed".
# Created via: cp $JDK/lib/security/cacerts ~/.gradle/corp-cacerts && keytool -importcert ...
systemProp.javax.net.ssl.trustStore=/Users/Giorgi.Maisuradze/.gradle/corp-cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
kotlin.stdlib.default.dependency=false
