name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  rider:
    name: Rider plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: rider
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rider-plugin
          path: rider/build/distributions/*.zip

  visual-studio:
    name: Visual Studio VSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build VSIX
        working-directory: vs
        run: msbuild /restore CopilotCompanion.sln /p:Configuration=Release /v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: visual-studio-vsix
          path: vs/CopilotCompanion/bin/Release/*.vsix

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rider, visual-studio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Add stable-named zip for the install scripts
        run: cp dist/copilot-companion-*.zip dist/copilot-companion.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.vsix
          generate_release_notes: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Update custom plugin repository (updatePlugins.xml)
        working-directory: repo
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E \
            -e "s|download/v[0-9.]+/copilot-companion-[0-9.]+\.zip|download/v${VERSION}/copilot-companion-${VERSION}.zip|" \
            -e "/<\?xml/! s|version=\"[0-9.]+\"|version=\"${VERSION}\"|" \
            updatePlugins.xml
          if git diff --quiet; then
            echo "updatePlugins.xml already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Point updatePlugins.xml at ${GITHUB_REF_NAME}"
            git push origin main
          fi
