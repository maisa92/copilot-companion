name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  rider:
    name: Rider plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: rider
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rider-plugin
          path: rider/build/distributions/*.zip

  visual-studio:
    name: Visual Studio VSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build VSIX
        working-directory: vs
        run: msbuild /restore CopilotCompanion.sln /p:Configuration=Release /v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: visual-studio-vsix
          path: vs/CopilotCompanion/bin/Release/*.vsix

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rider, visual-studio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.vsix
          generate_release_notes: true
